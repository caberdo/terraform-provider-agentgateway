# Publishing a tag is delegated to the reusable release workflow in
# caberdo/terraform-provider-kit.
#
# A release is a signed tag cut after the release pull request merges; the
# newest CHANGELOG.md section names the version, and this repository does not
# carry a version file. Three entry points remain:
#
# - A `workflow_call` from another workflow in this repository or downstream,
#   carrying the tag to publish.
# - A `push` of a signed `v*` tag from a developer machine. Cutting and pushing
#   that tag is the release step: a merge to `main` is not a release, and with
#   no version file no file change could identify one.
# - A `workflow_dispatch` naming an existing tag to publish or republish. The
#   kit runs GoReleaser with `release.mode: replace`, so republishing is
#   idempotent and the signed tag is untouched.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to release"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (or republish), e.g. v0.9.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-release.yml@v0.15.0
    # `contents: write` uploads the release; `id-token: write` mints the OIDC
    # identity `actions/attest` signs the provenance with; `attestations: write`
    # stores that provenance in the repository's attestation record. Nothing
    # else needs write access.
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      provider: agentgateway
      dist-prefix: terraform-provider-agentgateway
      # A `tag` push is detected from the ref, a dispatch carries the tag it
      # should publish, and a reusable call passes it as an input. This caller
      # never creates a tag: the kit's tag job is skipped without a version
      # file, and GoReleaser publishes the named tag.
      tag: ${{ inputs.tag }}
