# Publishing an existing tag is delegated to the reusable release workflow in
# caberdo/terraform-provider-kit.
#
# Three entry points remain:
#
# - A `workflow_call` from another workflow in this repository or downstream,
#   carrying the tag to publish. It is kept as the reusable entry point even
#   though `create-release-tag.yml` now calls the kit directly: the kit owns the
#   tag and the publish in one call, so routing that path through this file
#   would publish twice.
# - A `push` of a signed `v*` tag from a developer machine. GitHub does not
#   cascade workflows from a tag pushed with the default GITHUB_TOKEN, so the
#   merge path is `create-release-tag.yml`; this trigger exists for tags pushed
#   by hand.
# - A `workflow_dispatch` naming an existing tag to publish or republish. The
#   kit runs GoReleaser with `release.mode: replace`, so republishing is
#   idempotent and the signed tag is untouched.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to release"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (or republish), e.g. v0.9.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-release.yml@v0.8.0
    # `contents: write` uploads the release; `id-token: write` mints the OIDC
    # identity `actions/attest` signs the provenance with; `attestations: write`
    # stores that provenance in the repository's attestation record. Nothing
    # else needs write access.
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      provider: agentgateway
      dist-prefix: terraform-provider-agentgateway
      # A `tag` push is detected from the ref, a dispatch carries the tag it
      # should publish, and a reusable call passes it as an input. This caller
      # never creates a tag: the tag job is a no-op on every one of those paths
      # and GoReleaser publishes the named tag.
      tag: ${{ inputs.tag }}
