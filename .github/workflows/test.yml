# CI is delegated to the reusable workflows in caberdo/terraform-provider-kit.
#
# The triggers, the concurrency group and the token scopes stay here: a
# `workflow_call` file cannot declare triggers, and a called workflow can only
# narrow the token its caller grants. Everything else — the job steps, the
# versions-matrix parser, the coverage gate — lives in the kit.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-ci.yml@v0.8.0
    # GitHub validates a caller's grant against every job of the called workflow
    # before any `if:` or input is evaluated, so these are the union of what
    # provider-ci declares, not what this run happens to execute:
    #
    # - `contents: write` + `pull-requests: write`: requested unconditionally by
    #   the called `docs` job. Omitting them rejects the whole run with "The
    #   nested job 'docs' is requesting 'contents: write, pull-requests: write'"
    #   — even though `docs-mode: none` means that job only explains itself.
    # - `security-events: write`: the `Lint & Security` job uploads gosec SARIF
    #   to code scanning.
    #
    # This does not widen the token any other job runs with: every other job in
    # provider-ci.yml re-declares `contents: read` (and nothing else), and a
    # called job can narrow the caller's grant, never widen it.
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    with:
      provider: agentgateway
      provider-display: agentgateway
      module: github.com/caberdo/terraform-provider-agentgateway
      packages: ./internal/...
      # The matrix source of truth, named here so it cannot drift from the
      # acceptance call. agentgateway has no versions job (`versions-job` stays
      # at its `false` default), so nothing reads it in this caller yet.
      versions-file: .github/agentgateway-versions.txt
      # A release pull request is the only change that moves VERSION: the
      # changelog check catches a mismatch before the merge instead of after it.
      changelog: true
      # Dependency scanning stays in the Lint & Security job, through
      # `./scripts/govulncheck.sh` and its accepted-findings list. The default
      # (`action`) would move it into a separate Vulnerability Scan job.
      govuln-mode: script
      # gofmt is not one of golangci-lint's default linters, so CI runs the kit's
      # formatter check on top of golangci-lint. The local `make fmt-check` target
      # mirrors that check; both exist on purpose, and both must agree.
      gofmt-check: true
      # The generated docs must not drift; `docs-mode: none` keeps the check in
      # the Test job, where it lives today.
      docs: true
      # Re-check the coverage sentence in README.md from the Test job. Its
      # `make coverage-gate` wording is tfkit's default, so the check needs no
      # flag and guards the one line the kit migration changed.
      coverage-readme-in-test: true
      # Keeps the Coverage section of the job summary byte-identical.
      coverage-note: "Unit tests only: acceptance tests require `TF_ACC` and a live agentgateway."
