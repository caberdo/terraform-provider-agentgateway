name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # Build the linter with the toolchain in go.mod instead of downloading the
      # prebuilt binary. Released binaries are built with an older Go (v2.15.0
      # ships go1.27.0), which cannot read Go 1.27.3 export data: the lint run
      # fails with "export data version 5 is greater than maximum supported
      # version 4". goinstall mode compiles v2.15.0 with the same Go as the
      # module, so the two stay in step.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
          args: --config .golangci.yml

      # Dependency vulnerabilities are invisible to gosec and CodeQL, which
      # only read first-party code. The version is pinned here (no @latest) and
      # documented in CONTRIBUTING.md; update it deliberately, with the go.mod
      # toolchain it was tested against.
      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # scripts/govulncheck.sh fails only on findings that affect called code
      # and reads accepted findings from .github/govulncheck-accepted.txt.
      - name: Run govulncheck
        run: ./scripts/govulncheck.sh

      # Run gosec with the job's Go toolchain for the same reason as the linter:
      # the pinned action image is built with an older Go (v2.30.0 ships a
      # toolchain that cannot read Go 1.27.3 export data) and fails with
      # "package main has type errors, skipping SSA analysis". Pinning the
      # module version keeps the scanner reproducible without the image.
      - name: Run Gosec Security Scanner
        id: gosec
        continue-on-error: true
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 \
            -fmt sarif -out gosec.sarif -exclude-dir=vendor -tests=false ./

      - name: Upload security scan results
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        if: always() && hashFiles('gosec.sarif') != ''
        with:
          sarif_file: gosec.sarif

      - name: Fail on Gosec findings
        if: always() && steps.gosec.outcome == 'failure'
        run: |
          {
            echo "## Gosec Security Scanner Found Issues"
            echo ""
            if [ -f gosec.sarif ]; then
              echo "| Rule | File | Line | Description |"
              echo "|------|------|------|-------------|"
              jq -r '.runs[0].results[] | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.locations[0].physicalLocation.region.startLine) | \(.message.text) |"' gosec.sarif
            fi
            echo ""
            echo "See the **Security** tab for full details."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Verify go.mod is tidy and module hashes match
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Cross-platform build
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      - name: Validate examples
        env:
          REQUIRE_TERRAFORM: "1"
        run: ./scripts/validate-examples.sh

      # A release pull request is the only change that moves VERSION. Catch a
      # mismatch with CHANGELOG.md or the README install constraint here instead
      # of after the merge, where it would fail the tag workflow on main.
      - name: Check release metadata
        run: ./scripts/release-check.sh

      - name: Check generated docs are up to date
        run: |
          go generate ./...
          git diff --exit-code -- docs/

      - name: Run tests
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./internal/...

      - name: Coverage summary
        if: always()
        run: |
          if [[ ! -f coverage.out ]]; then
            echo "No coverage profile: the test step failed before writing one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Coverage"
            echo ""
            echo "Unit tests only: acceptance tests require \`TF_ACC\` and a live agentgateway."
            echo ""
            ./scripts/coverage-summary.sh coverage.out
          } >> "$GITHUB_STEP_SUMMARY"
          ./scripts/coverage-summary.sh coverage.out

      # Enforce the coverage floor on every pull request: the `Test` job is a
      # required context, so a regression below .github/coverage-baseline.txt
      # fails the PR instead of only surfacing on main/merge-queue.
      - name: Coverage gate (unit)
        if: always()
        run: ./scripts/coverage-gate.sh coverage.out

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
