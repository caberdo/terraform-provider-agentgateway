# Monitors the agentgateway maintenance window: compares the supported matrix
# with the upstream releases, canaries the newest release the matrix does not
# cover, and checks this repository's kit pin. Each job reports at most one
# labelled issue and closes it when the finding goes away. The workflow never
# edits the matrix or the pin: the bump stays a decision.
#
# The canary is meant to run weekly, but one caller cannot bind two cron
# schedules to different jobs, and a second workflow file is deliberately out
# of scope here. It therefore runs on this monthly schedule for now; split it
# out (or gate the jobs on `github.event.schedule`) when weekly matters.
name: Version maintenance

on:
  schedule:
    # Monthly, on the first day at 06:00 UTC.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  freshness:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-freshness.yml@v0.14.0
    # `issues: write` opens or updates one labelled issue per category;
    # `actions: read` lets the canary report read the failing job's log.
    permissions:
      contents: read
      issues: write
      actions: read
    with:
      provider-display: agentgateway
      versions-file: .github/agentgateway-versions.txt
      upstream: agentgateway/agentgateway
      # Upstream stable releases are tagged `v1.7.0` and the matrix holds the
      # same `v`-prefixed form, so neither side is normalised. Prereleases
      # (`v1.7.0-rc.1`, `v1.7.0-alpha.1`) are filtered before the comparison.
      strip-v: false
      canary: true
      version-env: AGENTGATEWAY_VERSION
      expect-version-env: AGENTGATEWAY_EXPECT_VERSION
      kit-check: true
