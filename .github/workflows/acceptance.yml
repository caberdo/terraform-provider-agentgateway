# The acceptance suite is delegated to the reusable acceptance workflow in
# caberdo/terraform-provider-kit.
#
# The triggers stay here. It remains a separate workflow from `test.yml` so the
# unit suite stays fast and the acceptance matrix can be tuned (timeouts,
# parallelism) on its own. The matrix parser keeps the existing selection: pull
# requests run the floor plus the newest release, main and the merge queue run
# the whole window from .github/agentgateway-versions.txt.
name: Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-acceptance.yml@v0.15.0
    permissions:
      contents: read
    with:
      provider: agentgateway
      provider-display: agentgateway
      packages: ./internal/...
      versions-file: .github/agentgateway-versions.txt
      version-env: AGENTGATEWAY_VERSION
      expect-version-env: AGENTGATEWAY_EXPECT_VERSION
      # One compose project per version so matrices cannot share containers,
      # volumes or port bindings. agentgateway versions carry dots, which the
      # kit rewrites to dashes while keeping the `v` (`agentgateway-acc-v1-7-0`).
      compose-project-prefix: agentgateway
      compose-dot-to-dash: true
      # Two gateways at a time keeps memory bounded on the standard runner
      # while still letting the matrix finish in two waves.
      max-parallel: 2
      acceptance-timeout: 45
