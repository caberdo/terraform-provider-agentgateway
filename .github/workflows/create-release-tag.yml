# Tagging and publishing are delegated to the reusable release workflow in
# caberdo/terraform-provider-kit.
#
# A push to `main` that changes `VERSION` is how merging the release pull
# request ships the version it prepared: the file is the trigger, so a merge
# that leaves it alone never releases. The `workflow_dispatch` entry point is
# kept for the cases the merge cannot cover: the first tag of a new line, a
# re-tag after a failure that happened before the tag was pushed, and a
# maintainer who needs to choose the version explicitly.
#
# The kit's release workflow owns both the signed tag and GoReleaser in one
# call. This caller used to create the tag and then invoke `release.yml`
# locally; the net effect is unchanged, but the publish no longer passes
# through a workflow_call boundary. `release.yml` remains the entry point for a
# tag pushed from a developer machine and for republishing an existing tag.
name: Create Release Tag

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (leave empty to auto-calculate from release_type; a push to main always uses VERSION)"
        required: false
        type: string
        default: ""
      release_type:
        description: "Type of release (used when version is empty)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"

permissions:
  contents: read

# Only a `VERSION` change starts a release, but a manual dispatch can race a
# merge. Serialise them instead of cancelling, so a half-created tag is never
# abandoned.
concurrency:
  group: create-release-tag
  cancel-in-progress: false

jobs:
  release:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-release.yml@v0.8.0
    # `contents: write` creates the tag and uploads the release; `id-token:
    # write` mints the OIDC identity `actions/attest` signs the provenance
    # with; `attestations: write` stores that provenance in the repository's
    # attestation record. The tag job only needs `contents: write`, but a
    # caller's grant is a ceiling for the whole called workflow, so the union
    # is the smallest grant that lets the publish job run.
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      provider: agentgateway
      dist-prefix: terraform-provider-agentgateway
      version-file: VERSION
      # The changelog is the only place a release is documented: refuse to ship
      # a version nobody wrote down.
      changelog-check: true
      # A re-run, or a dispatch for an already released version, must not fail:
      # an existing tag on the same commit means the release already happened.
      tag-exists: skip
      version: ${{ github.event.inputs.version }}
      release-type: ${{ github.event.inputs.release_type || 'patch' }}
