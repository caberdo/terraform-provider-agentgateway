# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# The read-only gateway of the acceptance environment (design §10).
#
# Storage mode `readOnly` rejects every write with "403 UI is configured as
# read-only" (C8). The mode needs no database, so this service has none.
#
# The provider fails `Configure` for a read-only gateway unless
# `storage_mode_check` is `warn` or `ignore` (design §6, D10); the
# acceptance test for this gateway sets it.
config:
  # The admin address has no authentication (C1), so it binds to every
  # interface of the container: the published port reaches it from the host
  # and the compose network reaches it by service name.
  adminAddr: "0.0.0.0:15001"
  storage:
    mode: readOnly
gateways:
  default:
    port: 4001
ui:
  gateways: default
llm:
  providers: []
  models: []
  virtualModels: []
mcp:
  targets: []
routes: []
