# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# The file-storage gateway of the acceptance environment (design §10).
#
# Storage mode `file` keeps every resource in this file. The list response
# omits the singleton kinds (C24), so the provider refuses them up front with
# "requires config.storage.mode = hybrid" instead of letting them silently
# drop out of state on the next refresh.
#
# The file is mounted read-write because a write rewrites it (C25).
config:
  # The admin address has no authentication (C1), so it binds to every
  # interface of the container: the published port reaches it from the host
  # and the compose network reaches it by service name.
  adminAddr: "0.0.0.0:15003"
  storage:
    mode: file
  session:
    # Auto-generated by agentgateway to encode session IDs. Changing it invalidates existing sessions.
    key: 5ff8624e2e385b564d76f0689f332e1e8c03ca2bf91285cc578c980fe5f60256
gateways:
  default:
    port: 4003
ui:
  gateways: default
llm:
  providers: []
  models: []
  virtualModels: []
mcp:
  targets: []
routes: []
