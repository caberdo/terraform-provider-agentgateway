# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# The file-owned gateway of the acceptance environment (design §10).
#
# Storage mode `hybrid`, like the hybrid gateway, but this file owns
# `mcp.statefulMode`. A write that changes the field fails with "409
# file-owned mcp.settings/default field cannot be updated in hybrid mode:
# statefulMode" (C9).
#
# The database path differs from the hybrid fixture so that the two
# databases cannot be confused when a volume is mounted by hand. Each
# service has its own volume, so the two gateways never share a database.
config:
  # The admin address has no authentication (C1), so it binds to every
  # interface of the container: the published port reaches it from the host
  # and the compose network reaches it by service name.
  adminAddr: "0.0.0.0:15002"
  storage:
    mode: hybrid
  database:
    url: sqlite:///config/fileowned.db
gateways:
  default:
    port: 4002
ui:
  gateways: default
llm:
  providers: []
  models: []
  virtualModels: []
mcp:
  statefulMode: stateless
  targets: []
routes: []
