# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# The hybrid gateway of the acceptance environment (design §10).
#
# Storage mode `hybrid` keeps this file as the read-only baseline and stores
# what Terraform writes in the SQLite database. Every resource therefore has
# a stable id and a revision, and a write never touches this file.
#
# The file deliberately has no `llm.policies.apiKey`: Terraform has to be
# able to create that policy, and an API key without it must fail with
# "409 DB-backed API keys require llm.policies.apiKey" (C10, C22, C23). The
# empty `llm` section is what a DB-backed LLM policy needs to exist at all
# (C22).
config:
  # The admin address has no authentication (C1), so it binds to every
  # interface of the container: the published port reaches it from the host
  # and the compose network reaches it by service name.
  adminAddr: "0.0.0.0:15000"
  storage:
    mode: hybrid
  database:
    url: sqlite:///config/data.db
gateways:
  default:
    port: 4000
ui:
  gateways: default
llm:
  providers: []
  models: []
  virtualModels: []
mcp:
  targets: []
routes: []
